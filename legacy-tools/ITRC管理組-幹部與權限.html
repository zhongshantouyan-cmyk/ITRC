<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ITRC 幹部與權限｜管理組</title>
<link rel="stylesheet" href="itrc.css">
<script src="itrc.js" defer></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="itrc-auth.js"></script>
<script src="itrc-roster.js"></script>
<style>
  .container{max-width:920px}
  .who{margin-left:auto;font-size:13px;color:#cdd6e8}
  .banner{background:var(--warn-bg);border:1px solid #e6d6a6;color:#6f5410;border-radius:var(--r);
    padding:11px 15px;margin-bottom:16px;font-size:13px;line-height:1.65}
  .banner b{color:#5a4410}
  .legend{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
  .legend .c{flex:1;min-width:200px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:11px 14px;box-shadow:var(--sh-1)}
  .legend .c b{color:var(--navy);font-size:13.5px} .legend .c p{margin:3px 0 0;font-size:12.5px;color:var(--muted);line-height:1.55}
  table{width:100%;border-collapse:collapse;font-size:13px;background:var(--card);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh-1)}
  th,td{padding:7px 9px;border-bottom:1px solid var(--line-2);text-align:left;vertical-align:middle}
  th{background:var(--bg-2);color:var(--ink-2);font-size:12px;font-weight:700}
  tr:last-child td{border-bottom:none}
  td input,td select{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:#fff;font-size:13px}
  td.del{text-align:center;width:46px}
  .del-btn{padding:6px 8px;color:var(--muted)}
  .del-btn:hover{color:var(--bad);border-color:var(--bad);background:var(--bad-bg)}
  td.empty{text-align:center;color:var(--muted);padding:26px 12px}
  .addbar{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 16px;margin-bottom:16px;box-shadow:var(--sh-1)}
  .addgrid{display:grid;grid-template-columns:1.1fr 1.6fr 1fr 1.2fr auto;gap:10px;align-items:end}
  .addgrid label{margin-bottom:4px}
  .r-officer{color:var(--ink-2)} .r-chair{color:var(--navy);font-weight:700} .r-advisor{color:var(--info);font-weight:700} .r-treasurer{color:var(--gold-ink);font-weight:700} .r-none{color:var(--muted)}
  #sheet_src{color:var(--gold-ink);font-weight:700;text-decoration:underline;text-underline-offset:2px} #sheet_src:hover{color:var(--gold);text-decoration-thickness:2px}
  .conn{font-size:12px;font-weight:700;color:#9fb0cc}
  .gate{max-width:460px;margin:60px auto;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:34px 28px;box-shadow:var(--sh-2)}
  .gate h2{margin:0 0 8px;color:var(--navy)} .gate p{color:var(--muted);font-size:13.5px;line-height:1.7}
  .handover{margin-top:22px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-1)}
  .handover>summary{cursor:pointer;padding:12px 16px;font-weight:700;color:var(--navy);list-style:none}
  .handover>summary::-webkit-details-marker{display:none}
  .handover>summary::before{content:'▸';color:var(--gold);margin-right:7px}
  .handover[open]>summary::before{content:'▾'}
  .handover .hbody{padding:2px 18px 16px;font-size:13px;color:var(--ink-2);line-height:1.75}
  .handover ol{margin:4px 0;padding-left:20px} .handover li{margin:3px 0}
  .tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .importbox{margin:0 0 16px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-1)}
  .importbox>summary{cursor:pointer;padding:11px 15px;font-weight:700;color:var(--navy);list-style:none;display:flex;align-items:center;gap:7px}
  .importbox>summary::-webkit-details-marker{display:none}
  .importbox>summary::after{content:'▸';color:var(--gold);margin-left:2px}
  .importbox[open]>summary::after{content:'▾'}
  .importbox .ibody{padding:0 15px 15px}
  .importbox textarea{width:100%;min-height:92px;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:13px;font-family:inherit;line-height:1.55;resize:vertical;box-sizing:border-box}
  .importbox .irow{display:flex;align-items:center;gap:10px;margin-top:9px;flex-wrap:wrap}
  .imp-tbl{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:11px;background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .imp-tbl th,.imp-tbl td{padding:5px 9px;border-bottom:1px solid var(--line-2);text-align:left}
  .imp-tbl th{background:var(--bg-2);color:var(--ink-2);font-size:11.5px;font-weight:700}
  .imp-tbl tr:last-child td{border-bottom:none}
  .imp-warn{color:var(--bad)}
  @media(max-width:680px){
    .addgrid{grid-template-columns:1fr 1fr}
    .addgrid>div:last-child{grid-column:1/-1}
    .addgrid>div:last-child .btn{width:100%}
    table{min-width:560px}
  }
</style>
</head>
<body>
<header class="apphead">
  <h1><svg class="svgic"><use href="#i-edit"></use></svg>幹部與權限</h1>
  <span class="sub">管理組 · 指派誰能用財務站</span>
  <div class="who"><span class="conn" id="conn">● 連線中…</span></div>
</header>

<div class="container" id="app"></div>

<template id="tpl-app">
  <div class="banner">
    本頁<b>限正副社長／顧問</b>編輯。權限用 <b>Email（Google 信箱）</b>比對；信箱留空或無權限者無法登入。實際存取同時受資料庫白名單限制，新增帳號後須由資訊組核對規則。<br>
    換屆或第一次設定，可按下方<b>「開啟名單匯入」</b>在已授權試算表複製資料，貼上後檢查預覽；也可用下面的「貼上／CSV」自行匯入。
  </div>

  <div class="legend">
    <div class="c"><b>社長／副社長</b><p>可改幹部名單與權限；在財務站「簽核」核准或退回核銷。</p></div>
    <div class="c"><b>顧問</b><p>可改幹部名單與權限（不簽核核銷）。社團保管帳號另供既定管理用途。</p></div>
    <div class="c"><b>財務長</b><p>可編收支表、把核准的核銷一鍵入帳、手動記帳、匯出 CSV。</p></div>
    <div class="c"><b>幹部</b><p>可在財務站「申請核銷」、檢視收支表。</p></div>
  </div>

  <div class="addbar">
    <div class="addgrid">
      <div><label>姓名</label><input id="n_name" placeholder="王小明"></div>
      <div><label>Email（Google）</label><input id="n_email" type="email" placeholder="person1@example.invalid"></div>
      <div><label>職稱</label><input id="n_title" placeholder="例：活動組員"></div>
      <div><label>權限</label><select id="n_role"></select></div>
      <div><button class="btn gold" onclick="addRow()"><svg class="svgic"><use href="#i-plus"></use></svg>新增</button></div>
    </div>
  </div>

  <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 12px">
    <button class="btn ghost sm" onclick="importFromSheet()"><svg class="svgic"><use href="#i-refresh"></use></svg>開啟名單匯入</button>
    <span class="hint">從 <a id="sheet_src" href="#" target="_blank" rel="noopener">名單試算表</a> 複製最新資料，預覽後合併；未列出的人員與歷史保留。</span>
  </div>

  <details class="importbox">
    <summary><svg class="svgic"><use href="#i-download"></use></svg>從 Excel／試算表 匯入名單（貼上或選 CSV）</summary>
    <div class="ibody">
      <p class="hint" style="margin:2px 0 9px">支援主表的<b>姓名、EMAIL、LINE 名稱、職稱、組別、幹部 ID、任期、在任狀態</b>。沒有權限欄時保留既有權限，新人待授權；離任／非當期／暫停會停權並保留歷史。職稱不會自動升權。<a href="#" onclick="dlTemplate();return false;">下載範本 CSV</a></p>
      <textarea id="imp_text" placeholder="從 Excel／Google 試算表 框選整塊複製，直接貼在這；或每行打：姓名,Email,職稱,權限"></textarea>
      <div class="irow">
        <label class="btn ghost sm">選 CSV 檔…<input type="file" id="imp_file" accept=".csv,.txt" hidden></label>
        <button class="btn ghost sm" onclick="parseImport()"><svg class="svgic"><use href="#i-search"></use></svg>解析預覽</button>
        <span class="hint" id="imp_msg"></span>
      </div>
      <div id="imp_preview"></div>
    </div>
  </details>

  <div class="tablewrap">
  <table>
    <thead><tr><th style="width:18%">姓名</th><th style="width:32%">Email（Google）</th><th style="width:18%">職稱</th><th style="width:22%">權限</th><th class="del">離任</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  </div>
  <p class="hint" id="count" style="margin-top:10px"></p>
  <details class="handover"><summary>離任與停用紀錄</summary><div class="hbody" id="retiredRows"></div></details>

  <details class="handover">
    <summary>換屆交接</summary>
    <div class="hbody">
      換屆＝<b>只換人、不動資料</b>（看板／講師排程／贊助／收支一律延續）。卸任前請依序：
      <ol>
        <li>把<b>新社長／副社長</b>設成「社長／副社長」、<b>新財務長</b>設成「財務長」，並填好他們的 Google 信箱。改權限的能力只給正副社長與顧問；其餘一律「幹部」，日後由社長／顧問親手開權限給需要的人。</li>
        <li>請新團隊各自用那個信箱的 Google 帳號<b>登入一次</b>、確認進得去。</li>
        <li>按<b>離任封存</b>移出現任名單並清空權限，保留原 ID 與交接紀錄；另請資訊組核對資料庫白名單。</li>
        <li>（選填）填本屆學期，按「封存本屆名單快照」留個記錄。</li>
      </ol>
      <div style="display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-top:6px">
        <div><label>本屆學期</label><input id="h_term" placeholder="例：114-2" style="width:150px"></div>
        <button class="btn ghost" onclick="archiveRoster()"><svg class="svgic"><use href="#i-pin"></use></svg>封存本屆名單快照</button>
      </div>
      <p class="hint" style="margin-top:10px">系統內建一個永久救援管理員，萬一全屆走光、沒人能編名單，可請維護者用它解鎖——不會死鎖。</p>
    </div>
  </details>
</template>

<script>
/* ───────────────────────────────────────────────
   LOCK：Google 登入上線後改成 true，本頁即自動限「審核/財務長」才能編輯。
   現在 false＝掀開著，任何人都能編。
   ─────────────────────────────────────────────── */
var LOCK = true;

var CFG = {apiKey:"AIzaSyBG41luYP0eyt9UUeuS0lybKTqWYi1GpLc",authDomain:"itrc-workspace.firebaseapp.com",
  databaseURL:"https://itrc-workspace-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"itrc-workspace",
  storageBucket:"itrc-workspace.firebasestorage.app",messagingSenderId:"462903407211",appId:"1:462903407211:web:9cc9217dcef3c97cf2372e"};

/* 幹部名單維持限制存取；只在已授權試算表複製或下載後預覽匯入。 */
var SHEET_CSV_URL = ''; // Private roster: no anonymous CSV endpoint.
var SHEET_VIEW_URL = 'https://docs.google.com/spreadsheets/d/1K7byAc1JhpcinOHSDnGEGfwy0kzfTnMB4U-neTjKMKg/edit?usp=sharing';   // 試算表本身，給「名單試算表」連結用

var ROLE_OPTS=[['chair','社長／副社長'],['advisor','顧問'],['treasurer','財務長'],['officer','幹部'],['','無權限（不可登入）']];
var ROLE_CLS={chair:'r-chair',advisor:'r-advisor',treasurer:'r-treasurer',officer:'r-officer','':'r-none'};
var ROLE_ORDER={chair:0,advisor:1,treasurer:2,officer:3,'':4};
var DATA=[], rolesRef=null, rosterGeneration=0, rosterListener=null, rosterReady=false, rosterBusy=false;
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(m){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]);});}
function eventId(value){return esc(JSON.stringify(String(value)).slice(1,-1).replace(/'/g,'\\u0027').replace(/</g,'\\u003c').replace(/>/g,'\\u003e'));}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function setConn(t){var c=$('conn');if(c)c.textContent=t;}

/* 115-1 官方幹部名單（資料庫空白時的開站保底；換屆改用「開啟名單匯入」從試算表帶入）。
   role：chair=正/副社長、advisor=顧問、treasurer=財務長、officer=一般幹部（含管理組PM/資訊長等）。*/
function seed(){ return []; }
function norm(v){return ITRCRoster.normalize(v);}

/* ───── 啟動：LOCK 決定要不要先驗身分 ───── */
window.addEventListener('DOMContentLoaded',function(){
  if(LOCK){
    ITRCAuth.init({onChange:function(u){
      if(ITRCAuth.can('roster')){ mount(); }
      else { stopRoster();showGate(u); }
    }});
  } else { mount(); }
});
function showGate(u){
  var msg = !u ? '<h2>請先登入</h2><p>此頁限正副社長／顧問編輯。</p><button class="btn gold" onclick="ITRCAuth.signIn()">用 Google 登入</button>'
                : '<h2>沒有編輯權限</h2><p>你的帳號（'+esc(u.email||u.name)+'）不是正副社長或顧問，無法編輯幹部名單與權限。</p>'
                  +(ITRCAuth.isDev()?'':'<div style="margin-top:14px"><button class="btn ghost sm" onclick="ITRCAuth.signOut()">登出換帳號</button></div>');
  $('app').innerHTML='<div class="gate">'+msg+'</div>';
}
var mounted=false;
function stopRoster(){rosterGeneration++;if(rolesRef&&rosterListener)rolesRef.off('value',rosterListener);rolesRef=null;rosterListener=null;rosterReady=false;rosterBusy=false;DATA=[];mounted=false;IMPORT_ROWS=null;IMPORT_META=null;}
function mount(){
  if(mounted){return;} mounted=true;
  $('app').innerHTML=''; $('app').appendChild($('tpl-app').content.cloneNode(true));
  // 下拉選單（職稱為自由輸入，不需預填）
  $('n_role').innerHTML=ROLE_OPTS.map(function(o){return '<option value="'+o[0]+'">'+o[1]+'</option>';}).join('');$('n_role').value='';
  // 在「姓名／Email」欄按 Enter 即新增
  [$('n_name'),$('n_email')].forEach(function(el){el.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();addRow();}});});
  // 選 CSV 檔 → 讀成文字丟進貼上框 → 直接解析預覽
  $('imp_file').addEventListener('change',function(e){
    var file=e.target.files[0]; if(!file)return;
    var rd=new FileReader();
    rd.onload=function(){ $('imp_text').value=String(rd.result||'').replace(/^﻿/,''); parseImport(); };
    rd.readAsText(file,'UTF-8'); e.target.value='';
  });
  // 「名單試算表」來源連結
  var src=$('sheet_src'); if(src){var u=SHEET_VIEW_URL||SHEET_CSV_URL; src.href=u||'#'; if(!u){src.title='尚未設定名單試算表網址';}}
  initData();
}

/* ───── 資料層（本機/測試＝localStorage、不寫雲端；正式＝雲端 roles/）
   測試判斷統一交給 ITRCAuth.isDev()，與財務站一致，避免「auth 進測試但資料層仍寫雲端」的脫鉤。 ───── */
function initData(){
  if(ITRCAuth.isDev()){
    try{DATA=JSON.parse(localStorage.getItem('itrc_roles_test')||'[]');}catch(e){DATA=[];}
    DATA=norm(DATA);rosterReady=true;setConn('● 測試（本機·不寫雲端）'); render();
  }else{
    if(!(firebase.apps&&firebase.apps.length))firebase.initializeApp(CFG);
    rolesRef=firebase.database().ref('roles');
    var generation=rosterGeneration;setConn('● 載入中');
    rosterListener=function(s){if(generation!==rosterGeneration)return;try{DATA=norm(s.val());rosterReady=true;setConn('● 雲端共用');render();}catch(e){rosterReady=false;setConn('● 名單需核對：'+e.message);}};
    rolesRef.on('value',rosterListener,function(){if(generation!==rosterGeneration)return;rosterReady=false;DATA=[];render();setConn('● 讀取失敗；未切換本機資料');});
  }
}
async function mutateRoster(change,message,expected){
  if(!ITRCAuth.can('roster')||!rosterReady){alert('請先登入，並等候名單完整載入。');return false;}
  if(rosterBusy){alert('上一筆正在儲存，請稍候。');return false;}
  var generation=rosterGeneration;rosterBusy=true;setConn('● 儲存中…');
  try{
    if(ITRCAuth.isDev()){var local=norm(DATA);if(expected&&JSON.stringify(local)!==expected)throw new Error('名單已變更，請重新預覽。');DATA=ITRCRoster.validate(change(local));localStorage.setItem('itrc_roles_test',JSON.stringify(DATA));}
    else{var conflict='';var result=await rolesRef.transaction(function(current){
      try{var rows=norm(current);if(expected&&JSON.stringify(rows)!==expected){conflict='名單已變更，請重新預覽。';return;}return ITRCRoster.validate(change(rows));}
      catch(e){conflict=e.message;return;}
    },undefined,false);if(!result.committed)throw new Error(conflict||'名單未寫入，請重新載入再試。');if(generation!==rosterGeneration)return false;DATA=norm(result.snapshot.val());}
    if(generation!==rosterGeneration)return false;rosterBusy=false;render();setConn(ITRCAuth.isDev()?'● 測試（本機·不寫雲端）':'● 已儲存至雲端');if(window.itrcToast)itrcToast(message);return true;
  }catch(e){if(generation!==rosterGeneration)return false;rosterBusy=false;setConn('● 尚未儲存');alert('尚未儲存：'+e.message);render();return false;}
}

/* ───── CRUD ───── */
async function addRow(){
  var name=$('n_name').value.trim();
  if(!name){alert('請填姓名');return;}
  var row={id:uid(),name:name,email:$('n_email').value.trim(),title:$('n_title').value.trim(),role:$('n_role').value,status:'active',active:true,disabled:false};
  if(!await mutateRoster(function(rows){rows.push(row);return rows;},'已新增 '+name))return;
  $('n_name').value='';$('n_email').value='';$('n_title').value='';$('n_name').focus();
}
function importFromSheet(){
  if(!ITRCAuth.can('roster')){ alert('請使用有名單管理權限的帳號登入。'); return; }
  var box=document.querySelector('.importbox'); if(box)box.open=true;
  var msg=$('imp_msg'); if(msg)msg.textContent='請在已授權的名單試算表複製資料後貼上，或選取下載的 CSV，再檢查預覽。名單不必公開分享。';
  var input=$('imp_text'); if(input)input.focus();
}
async function upd(id,field,val){if(['name','email','title','role'].indexOf(field)<0)return;await mutateRoster(function(rows){var r=rows.find(function(x){return x.id===id;});if(!r||ITRCRoster.inactive(r))throw new Error('這位幹部已離任，請重新載入。');if(field==='role'&&val!==''&&ITRCRoster.roles.indexOf(val)<0)throw new Error('權限無效。');r[field]=val;return rows;},'已更新幹部資料');}
async function del(id){var r=DATA.find(function(x){return x.id===id;});if(!r)return;if(!confirm('將「'+r.name+'」移出現任名單並停止登入權限？原 ID、姓名及歷史工作紀錄會保留。'))return;var user=ITRCAuth.user,now=new Date().toISOString();await mutateRoster(function(rows){return rows.map(function(x){return x.id===id?ITRCRoster.retire(x,user,now):x;});},'已離任封存並停止權限：'+r.name);}
async function reactivate(id){if(!confirm('重新啟用此人員對照？登入權限仍為空白，需另行指派並核對資料庫白名單。'))return;await mutateRoster(function(rows){var r=rows.find(function(x){return x.id===id;});if(!r)throw new Error('找不到該人員。');r.status='active';r.active=true;r.disabled=false;r.role='';r.reactivatedAt=new Date().toISOString();return rows;},'已重新啟用人員對照，仍待指派權限');}
async function archiveRoster(){
  if(!ITRCAuth.can('roster')||!rosterReady)return;
  var term=($('h_term').value||'').trim();
  if(!term){alert('請先填本屆學期，例如 114-2');return;}
  if(!confirm('把目前 '+DATA.length+' 人的名單封存為「'+term+'」快照？（名單本身不會清空、其他資料也不動）'))return;
  var snap={term:term, savedAt:new Date().toISOString(),
    members:DATA.map(function(r){return Object.assign({},r);})};
  var key=term.replace(/[.#$/\[\]]/g,'_')+'_'+uid();
  try{if(ITRCAuth.isDev()){
    var arch={}; try{arch=JSON.parse(localStorage.getItem('itrc_roles_archive')||'{}');}catch(e){}
    arch[key]=snap; localStorage.setItem('itrc_roles_archive',JSON.stringify(arch));
  }else{await firebase.database().ref('roles_archive/'+key).set(snap);}
  if(window.itrcToast)itrcToast('已封存本屆名單快照：'+term);}catch(e){alert('封存失敗，尚未儲存：'+e.message);}
}

/* ───── 從 Excel／CSV 匯入名單（貼上或選檔 → 預覽 → 覆蓋）───── */
var IMPORT_ROWS=null, IMPORT_META=null;
function roleFromText(s){
  s=(s||'').trim();
  if(!s) return 'officer';                          // 權限留空＝幹部
  if(/^(chair|advisor|treasurer|officer)$/i.test(s)) return s.toLowerCase();
  if(/無|不可登入|停用|離任|none/i.test(s)) return '';
  if(/財務/.test(s)) return 'treasurer';
  if(/社長/.test(s)) return 'chair';                // 社長／副社長
  if(/顧問|指導/.test(s)) return 'advisor';         // 只有顧問給 roster 權限；管理組PM／資訊長不再自動升，其餘＝幹部
  return 'officer';                                 // 幹部／組員／未知 → 幹部
}
function splitLine(line,delim){
  var out=[],cur='',q=false;
  for(var i=0;i<line.length;i++){var ch=line[i];
    if(q){ if(ch==='"'){ if(line[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=ch; }
    else { if(ch==='"')q=true; else if(ch===delim){out.push(cur);cur='';} else cur+=ch; }}
  out.push(cur); return out;
}
function parseCells(raw,delim){
  var rows=[],row=[],cell='',quoted=false;
  for(var i=0;i<raw.length;i++){var c=raw[i];
    if(quoted){if(c==='"'){if(raw[i+1]==='"'){cell+='"';i++;}else quoted=false;}else cell+=c;}
    else if(c==='"')quoted=true;else if(c===delim){row.push(cell);cell='';}
    else if(c==='\n'){row.push(cell);if(row.some(function(v){return v.trim();}))rows.push(row);row=[];cell='';}
    else if(c!=='\r')cell+=c;
  }
  if(quoted)throw new Error('引號未成對，請檢查 CSV。');
  row.push(cell);if(row.some(function(v){return v.trim();}))rows.push(row);return rows;
}
function parseImport(){
  IMPORT_ROWS=null;IMPORT_META=null;$('imp_preview').innerHTML='';
  var raw=($('imp_text').value||'').replace(/^﻿/,'');
  if(!raw.trim()){$('imp_msg').textContent='貼上內容，或選一個 CSV 檔';return;}
  try{
    var cells=parseCells(raw,raw.indexOf('\t')>=0?'\t':','),head=cells[0]||[],col={};
    var aliases={name:['姓名','名字','name'],email:['email','e-mail','mail','信箱','郵件'],title:['職稱','頭銜','職務','title'],role:['權限','角色','role'],personId:['幹部id','personid'],lineName:['line名稱','linename'],group:['組別','group'],term:['任期','term'],status:['在任狀態','狀態','status']};
    Object.keys(aliases).forEach(function(field){col[field]=head.findIndex(function(h){return aliases[field].indexOf(h.replace(/\s/g,'').toLowerCase())>=0;});});
    var hasHeader=col.name>=0||col.email>=0;if(!hasHeader){col.name=0;col.email=1;col.title=2;col.role=3;}
    var incoming=[],skipped=0;
    cells.slice(hasHeader?1:0).forEach(function(values){
      var row={};Object.keys(col).forEach(function(field){if(col[field]>=0)row[field]=String(values[col[field]]||'').trim();});
      if(!row.name){skipped++;return;}
      if(row.role==='')delete row.role;else if(row.role!==undefined){
        var known=/^(chair|advisor|treasurer|officer|社長|副社長|社長／副社長|顧問|財務長|幹部|無權限|無權限（不可登入）|停用|離任|none)$/i;
        if(!known.test(row.role))throw new Error('權限欄有未知值：'+row.role);row.role=roleFromText(row.role);
      }
      if(row.status!==undefined&&row.status!==''&&!/^(在任|active|待確認|pending|非當期名單|inactive|已卸任|離任|retired|暫停)$/i.test(row.status))throw new Error('在任狀態有未知值：'+row.status);
      if(row.status==='')delete row.status;incoming.push(row);
    });
    if(!incoming.length)throw new Error('沒有解析到人員，每列至少要有姓名。');
    IMPORT_ROWS=ITRCRoster.merge(DATA,incoming,ITRCAuth.user,new Date().toISOString(),uid);
    IMPORT_META={hasRoleCol:col.role>=0,expected:JSON.stringify(DATA),source:raw,imported:incoming.length};
    renderImportPreview(IMPORT_ROWS,skipped);
  }catch(e){IMPORT_ROWS=null;IMPORT_META=null;$('imp_msg').textContent=e.message;}
}
function renderImportPreview(rows,skipped){
  var roleLabel={chair:'社長／副社長',advisor:'顧問',treasurer:'財務長',officer:'幹部','':'無權限'};
  var body=rows.map(function(r){return '<tr><td>'+esc(r.personId||r.id)+'</td><td>'+esc(r.name)+'</td><td>'+esc(r.email||'未填')+'</td><td>'+esc(r.title)+'</td><td>'+roleLabel[r.role]+'</td><td>'+(ITRCRoster.inactive(r)?'已卸任／停用':'在任')+'</td></tr>';}).join('');
  $('imp_msg').textContent='帶入 '+IMPORT_META.imported+' 列，合併後共 '+rows.length+' 人；未列出的人員保留。'+(skipped?'略過 '+skipped+' 列空姓名。':'')+'職稱不會自動授權。';
  $('imp_preview').innerHTML='<table class="imp-tbl"><thead><tr><th>固定 ID</th><th>姓名</th><th>Email</th><th>職稱</th><th>權限</th><th>狀態</th></tr></thead><tbody>'+body+'</tbody></table>'
    +'<div class="irow"><button class="btn gold sm" onclick="commitImport()">套用這次名單更新</button><span class="hint">離任會清空權限，歷史資料保留；核對後才套用。</span></div>';
}
async function commitImport(){
  if(!IMPORT_ROWS||!IMPORT_META)return;
  if(($('imp_text').value||'').replace(/^﻿/,'')!==IMPORT_META.source){alert('內容已變更，請重新解析預覽。');return;}
  if(!confirm('套用已預覽的幹部資料與權限差異？未列出的人員、收支表與工作紀錄都會保留。'))return;
  var rows=JSON.parse(JSON.stringify(IMPORT_ROWS)),expected=IMPORT_META.expected;
  if(!await mutateRoster(function(){return rows;},'已合併更新幹部名單',expected))return;
  IMPORT_ROWS=null;IMPORT_META=null;$('imp_text').value='';$('imp_preview').innerHTML='';$('imp_msg').textContent='';
}
function dlTemplate(){
  var rows=[['姓名','Email','職稱','權限'],
    ['王小明','person2@example.invalid','社長','社長'],
    ['李大華','person3@example.invalid','財務長','財務長'],
    ['陳美美','person4@example.invalid','資訊長','幹部'],
    ['張三','person5@example.invalid','活動組員','幹部']];
  var csv='﻿'+rows.map(function(r){return r.join(',');}).join('\r\n');
  var a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download='ITRC幹部名單範本.csv'; document.body.appendChild(a); a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},0);
}

function render(){
  if(!$('rows'))return;
  var roleOpt=function(sel){return ROLE_OPTS.map(function(o){return '<option value="'+o[0]+'"'+(o[0]===sel?' selected':'')+'>'+o[1]+'</option>';}).join('');};
  var ord=function(r){return ROLE_ORDER[r.role]==null?9:ROLE_ORDER[r.role];};
  var sorted=DATA.filter(function(r){return !ITRCRoster.inactive(r);}).sort(function(a,b){return ord(a)-ord(b)||a.name.localeCompare(b.name,'zh-Hant');});
  $('rows').innerHTML=sorted.map(function(r){
    return '<tr>'
      +'<td><input value="'+esc(r.name)+'" onchange="upd(\''+eventId(r.id)+'\',\'name\',this.value)"></td>'
      +'<td><input type="email" value="'+esc(r.email)+'" placeholder="尚未填信箱" onchange="upd(\''+eventId(r.id)+'\',\'email\',this.value.trim())"></td>'
      +'<td><input value="'+esc(r.title)+'" placeholder="例：活動組員" onchange="upd(\''+eventId(r.id)+'\',\'title\',this.value.trim())"></td>'
      +'<td class="'+(ROLE_CLS[r.role]||'')+'"><select onchange="upd(\''+eventId(r.id)+'\',\'role\',this.value)">'+roleOpt(r.role)+'</select></td>'
      +'<td class="del"><button class="btn ghost sm del-btn" title="離任封存" aria-label="離任封存" onclick="del(\''+eventId(r.id)+'\')"><svg class="svgic"><use href="#i-trash"></use></svg></button></td></tr>';
  }).join('') || '<tr><td colspan="5" class="empty">名單是空的，用上方表單新增第一位幹部，或按「開啟名單匯入」從試算表帶入。</td></tr>';
  var current=DATA.filter(function(r){return !ITRCRoster.inactive(r);}),retired=DATA.filter(ITRCRoster.inactive);
  $('count').textContent='現任 '+current.length+' 位 · 已填信箱 '+current.filter(function(r){return r.email;}).length+' 位 · 離任／停用 '+retired.length+' 位（保留歷史）';
  var archive=$('retiredRows');if(archive)archive.innerHTML=retired.length?'<table><thead><tr><th>姓名</th><th>原職稱</th><th>離任時間</th><th>狀態</th><th>操作</th></tr></thead><tbody>'+retired.map(function(r){return '<tr><td>'+esc(r.name)+'</td><td>'+esc(r.title)+'</td><td>'+esc(r.retiredAt||'已停用')+'</td><td>已停權</td><td><button class="btn ghost sm" onclick="reactivate(\''+eventId(r.id)+'\')">重新啟用對照</button></td></tr>';}).join('')+'</tbody></table>':'目前沒有離任紀錄。';
}
